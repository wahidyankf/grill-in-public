# Project-scoped Codex settings for Grill in Public. Codex loads this layer only
# for a trusted project, and it sits above the user config in precedence.
#
# Codex reads AGENTS.md for repository rules; this file holds tool settings
# only. Subagents are discovered from .codex/agents/*.toml and do not need to be
# registered here. See repo-governance/conventions/agent-harness-support.md.

[agents]
# Subagents stay available so the shared drill-reviewer and repo-explorer roles
# can be spawned in this repository.
enabled = true
